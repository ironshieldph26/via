name: Publish Package

# 1. Enable manual triggering alongside your normal triggers (e.g., push to main)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to publish'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies and build
        run: npm ci

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
